<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Sun Ledger — Admin</title>
<style>
  :root{
    --bg1:#081712; --panel:#0f2818; --panel2:#0a1f14; --line:#1e3d2a;
    --accent:#22c55e; --accent2:#f0b429; --text:#e8f3ec; --muted:#7fa08e;
    --danger:#f87171; --safe:#4ade80;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg1);color:var(--text);margin:0;padding:16px;}
  .container{max-width:700px;margin:0 auto;}
  h1{font-size:20px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;margin-bottom:10px;}
  button{width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#04210f;font-weight:800;cursor:pointer;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .stat-row{display:flex;gap:10px;margin-bottom:16px;}
  .stat{flex:1;background:var(--panel2);border-radius:10px;padding:12px;text-align:center;}
  .stat .num{font-size:22px;font-weight:800;color:var(--accent2);}
  .stat .lbl{font-size:11px;color:var(--muted);}
  .row{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px;}
  .row:last-child{border-bottom:none;}
  .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:800;}
  .badge.active{background:rgba(74,222,128,.15);color:var(--safe);}
  .badge.expired{background:rgba(248,113,113,.15);color:var(--danger);}
  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab{flex:1;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;text-align:center;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;}
  .tab.active{background:var(--accent);color:#04210f;}
  #error{color:var(--danger);font-size:13px;margin-bottom:8px;}
</style>
</head>
<body>
<div class="container">
  <h1>🌙 Moon Sun Ledger — Admin ☀️</h1>

  <div id="loginBox" class="card">
    <div id="error"></div>
    <input type="password" id="adminPass" placeholder="Weka admin password">
    <button onclick="login()">Ingia</button>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="stat-row">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Jumla ya Maduka</div></div>
      <div class="stat"><div class="num" id="statActive">0</div><div class="lbl">Bado Trial</div></div>
      <div class="stat"><div class="num" id="statExpired">0</div><div class="lbl">Trial Imeisha</div></div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabShopsBtn" onclick="showSection('shops')">Maduka</div>
      <div class="tab" id="tabMsgsBtn" onclick="showSection('msgs')">Ujumbe wa Support</div>
    </div>

    <div id="shopsSection" class="card"></div>
    <div id="msgsSection" class="card" style="display:none;"></div>
  </div>
</div>

<script>
let adminPassword = '';

async function login(){
  const pass = document.getElementById('adminPass').value;
  const errEl = document.getElementById('error');
  errEl.textContent = '';

  const res = await fetch('/api/admin', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ password: pass })
  });
  const data = await res.json();
  if(!res.ok){ errEl.textContent = data.error || 'Password si sahihi.'; return; }

  adminPassword = pass;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  renderDashboard(data);
}

function showSection(name){
  document.getElementById('shopsSection').style.display = name==='shops' ? 'block' : 'none';
  document.getElementById('msgsSection').style.display = name==='msgs' ? 'block' : 'none';
  document.getElementById('tabShopsBtn').classList.toggle('active', name==='shops');
  document.getElementById('tabMsgsBtn').classList.toggle('active', name==='msgs');
}

function renderDashboard(data){
  const shops = data.shops || [];
  const msgs = data.messages || [];

  const active = shops.filter(s=>s.trialActive).length;
  document.getElementById('statTotal').textContent = shops.length;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statExpired').textContent = shops.length - active;

  let shopsHtml = '';
  shops.forEach(s=>{
    shopsHtml += `
      <div class="row">
        <b>${s.business_name || '(Hakuna jina)'}</b> — ${s.phone}<br>
        <span class="badge ${s.trialActive?'active':'expired'}">${s.trialActive ? 'Trial: siku '+s.daysLeft+' zimebaki' : 'Trial imeisha'}</span>
        <span style="color:var(--muted);"> · Alisajili: ${new Date(s.created_at).toLocaleDateString()}</span>
      </div>`;
  });
  document.getElementById('shopsSection').innerHTML = shopsHtml || '<div class="row">Hakuna maduka bado.</div>';

  let msgsHtml = '';
  msgs.forEach(m=>{
    msgsHtml += `
      <div class="row">
        <b>${m.business_name || m.phone}</b> · ${m.phone}<br>
        ${m.message}<br>
        <span style="color:var(--muted);font-size:11px;">${new Date(m.ts).toLocaleString()}</span>
      </div>`;
  });
  document.getElementById('msgsSection').innerHTML = msgsHtml || '<div class="row">Hakuna ujumbe bado.</div>';
}
</script>
</body>
</html>
