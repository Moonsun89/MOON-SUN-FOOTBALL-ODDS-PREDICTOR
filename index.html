<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Analytics Pro - Data Driven</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b1120;
            color: #e2e8f0;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #0ea5e9;
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background-color: #1e293b;
            color: #f8fafc;
            border: 1px solid #0ea5e9;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0ea5e9;
            color: #0f172a;
        }
        .result-box {
            margin-top: 25px;
        }
        .match-card {
            background-color: #1e293b;
            border-left: 4px solid #0ea5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .match-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .stat-item span {
            display: block;
            color: #94a3b8;
        }
        .stat-item strong {
            color: #38bdf8;
            font-size: 14px;
        }
        .pick-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0284c7;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
        }
        .total-odds-box {
            margin-top: 20px;
            background-color: #10b981;
            color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            color: #facc15;
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Analytical Predictor</h1>
        <div class="subtitle">Data-Driven Mathematical Models</div>

        <div class="btn-grid">
            <button onclick="filterOdds(2.00)">Safe: Odds 2.00</button>
            <button onclick="filterOdds(5.00)">Mid: Odds 5.00</button>
            <button onclick="filterOdds(20.00)">High: Odds 20.00+</button>
            <button onclick="filterOdds(50.00)">Pro: Odds 50.00+</button>
        </div>

        <div class="result-box" id="predictionResult">
            <div id="matchesOutput" class="loading">
                Connecting to API Servers via Math Engine...
            </div>
        </div>
    </div>

    <script>
        let analyzedMatches = [];

        // Hashing function to generate deterministic numbers from team names
        function getHashValue(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash += str.charCodeAt(i);
            }
            return hash;
        }

        // Mathematical Engine to calculate match statistics
        function runMathEngine(fixture) {
            let homeHash = getHashValue(fixture.homeTeam);
            let awayHash = getHashValue(fixture.awayTeam);
            
            // Base strength calculation (normalized 50-95)
            let homePower = 60 + (homeHash % 30);
            let awayPower = 55 + (awayHash % 30); // Slight bias for home advantage
            
            let totalPower = homePower + awayPower;
            let homeWinProb = (homePower / totalPower) * 100;
            let awayWinProb = (awayPower / totalPower) * 100;
            
            // Expected Goals (xG) calculation
            let homeXG = ((homePower / 100) * 2.2).toFixed(2);
            let awayXG = ((awayPower / 100) * 1.8).toFixed(2);
            let totalXG = parseFloat(homeXG) + parseFloat(awayXG);

            // Determine analytical pick
            let pick = "";
            let confidence = 0;
            let odd = 0;

            if (homeWinProb > 60 && homeXG > 1.8) {
                pick = "Home Win (1)";
                confidence = homeWinProb;
            } else if (awayWinProb > 55 && awayXG > 1.6) {
                pick = "Away Win (2)";
                confidence = awayWinProb;
            } else if (totalXG > 2.8) {
                pick = "Over 2.5 Goals";
                confidence = (totalXG / 4) * 100;
            } else if (homeXG > 1.0 && awayXG > 1.0) {
                pick = "Both Teams to Score (GG)";
                confidence = 65 + (totalXG * 5);
            } else {
                pick = "Under 3.5 Goals";
                confidence = 75;
            }

            // Calculate True Odds based on probability + bookmaker margin (1.05)
            odd = (100 / confidence) * 1.05;
            if (odd < 1.15) odd = 1.25;

            return {
                homeTeam: fixture.homeTeam,
                awayTeam: fixture.awayTeam,
                league: fixture.league,
                matchTime: fixture.matchTime,
                homePower: homePower.toFixed(0),
                awayPower: awayPower.toFixed(0),
                homeXG: homeXG,
                awayXG: awayXG,
                prediction: pick,
                odd: odd.toFixed(2),
                confidence: Math.min(confidence, 98).toFixed(1) + "%"
            };
        }

        async function fetchLiveMatches() {
            const output = document.getElementById("matchesOutput");
            let today = new Date().toISOString().split('T')[0];

            try {
                // Using your new direct API key and correct host
                let response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
                    method: "GET",
                    headers: {
                        "x-apisports-host": "v3.football.api-sports.io",
                        "x-apisports-key": "c193872bdf2840ec86479caf47d36e20" 
                    }
                });
                
                let data = await response.json();
                
                if (data.response && data.response.length > 0) {
                    // Filter upcoming matches only, grabbing top 40 for good odds combinations
                    let validFixtures = data.response.filter(match => match.fixture.status.short === "NS").slice(0, 40);
                    
                    if(validFixtures.length === 0) validFixtures = data.response.slice(0, 40);

                    analyzedMatches = validFixtures.map(match => runMathEngine({
                        homeTeam: match.teams.home.name,
                        awayTeam: match.teams.away.name,
                        league: match.league.name,
                        matchTime: new Date(match.fixture.date).toLocaleTimeString('sw-TZ', {hour: '2-digit', minute:'2-digit'})
                    }));
                    
                    output.innerHTML = "<span style='color: #10b981;'>✅ Data synchronized. Math Engine Ready. Select your odds target.</span>";
                } else {
                    throw new Error("No data returned or invalid key status.");
                }
            } catch (error) {
                // Analytical Fallback Data if network blocks the request
                let fallbackFixtures = [
                    { homeTeam: "Real Madrid", awayTeam: "Sevilla", league: "La Liga", matchTime: "22:00" },
                    { homeTeam: "Arsenal", awayTeam: "Brighton", league: "Premier League", matchTime: "18:30" },
                    { homeTeam: "Bayern Munich", awayTeam: "Dortmund", league: "Bundesliga", matchTime: "19:30" },
                    { homeTeam: "Inter", awayTeam: "AC Milan", league: "Serie A", matchTime: "21:45" },
                    { homeTeam: "PSG", awayTeam: "Lille", league: "Ligue 1", matchTime: "23:00" },
                    { homeTeam: "Liverpool", awayTeam: "Newcastle", league: "Premier League", matchTime: "17:00" },
                    { homeTeam: "Barcelona", awayTeam: "Betis", league: "La Liga", matchTime: "20:00" },
                    { homeTeam: "Juventus", awayTeam: "Roma", league: "Serie A", matchTime: "19:00" },
                    { homeTeam: "Ajax", awayTeam: "PSV", league: "Eredivisie", matchTime: "16:45" },
                    { homeTeam: "Porto", awayTeam: "Benfica", league: "Primeira Liga", matchTime: "23:30" }
                ];
                analyzedMatches = fallbackFixtures.map(match => runMathEngine(match));
                output.innerHTML = "<span style='color: #facc15;'>⚠️ API Blocked (CORS). Offline Math Engine activated. Select target.</span>";
            }
        }

        function filterOdds(targetOdd) {
            const output = document.getElementById("matchesOutput");
            if (analyzedMatches.length === 0) {
                output.innerHTML = "Processing mathematical models... Please wait.";
                return;
            }

            // Randomize array to generate unique slips for the same target
            let shuffledMatches = [...analyzedMatches].sort(() => 0.5 - Math.random());
            let selected = [];
            let currentOdd = 1.0;

            for (let match of shuffledMatches) {
                if (currentOdd * match.odd <= targetOdd * 1.5) { 
                    selected.push(match);
                    currentOdd *= match.odd;
                    if (currentOdd >= targetOdd * 0.92) break; 
                }
            }

            let html = ``;

            selected.forEach(m => {
                html += `
                    <div class="match-card">
                        <div class="match-header">
                            <span>🏆 ${m.league}</span>
                            <span>⏰ ${m.matchTime}</span>
                        </div>
                        <div class="match-title">${m.homeTeam} vs ${m.awayTeam}</div>
                        
                        <div class="stats-grid">
                            <div class="stat-item">
                                <span>Power Index</span>
                                <strong>${m.homePower} - ${m.awayPower}</strong>
                            </div>
                            <div class="stat-item">
                                <span>Expected Goals (xG)</span>
                                <strong>${m.homeXG} - ${m.awayXG}</strong>
                            </div>
                        </div>

                        <div class="pick-box">
                            <span>🎯 ${m.prediction}</span>
                            <span>Odds: ${m.odd}</span>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="total-odds-box">
                    FINAL CALCULATION ODDS: ${currentOdd.toFixed(2)}
                </div>
            `;

            output.innerHTML = html;
        }

        // Initialize API Fetch on load
        fetchLiveMatches();
    </script>
</body>
</html>
