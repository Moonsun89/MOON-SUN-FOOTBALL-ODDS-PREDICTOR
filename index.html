<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1f16">
<title>Duka Hesabu</title>
<style>
  :root{
    --bg1:#081712; --panel:#0f2818; --panel2:#0a1f14; --line:#1e3d2a;
    --accent:#22c55e; --accent2:#f0b429; --text:#e8f3ec; --muted:#7fa08e;
    --danger:#f87171; --safe:#4ade80;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:radial-gradient(circle at 20% 0%, #123322 0%, var(--bg1) 55%);
    color:var(--text); margin:0; padding:12px; min-height:100dvh;
    display:flex; flex-direction:column;
  }
  .container{max-width:520px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;}
  header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 14px;}
  header h1{margin:0;font-size:20px;font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .lang-toggle{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}

  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab-btn{flex:1;padding:11px 6px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;text-align:center;}
  .tab-btn.active{background:var(--accent);color:#04210f;border-color:var(--accent);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .stat-row{display:flex;gap:10px;}
  .stat{flex:1;background:var(--panel2);border-radius:10px;padding:12px;text-align:center;}
  .stat .label{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .stat .value{font-size:18px;font-weight:800;color:var(--accent2);}
  .stat .value.debt{color:var(--danger);}

  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600;}
  input,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:14px;}
  .form-row{display:flex;gap:8px;}
  .form-row > div{flex:1;}
  .btn{width:100%;padding:13px;border-radius:10px;border:none;font-weight:800;
    font-size:14px;cursor:pointer;margin-top:14px;}
  .btn-primary{background:var(--accent);color:#04210f;}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}

  .filter-row{display:flex;gap:6px;margin:12px 0;}
  .filter-btn{flex:1;padding:8px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;text-align:center;}
  .filter-btn.active{background:var(--panel);color:var(--accent2);border-color:var(--accent2);}

  .list-item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .li-main{flex:1;min-width:0;}
  .li-title{font-weight:700;font-size:14px;}
  .li-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .li-amount{font-weight:800;font-size:15px;color:var(--accent2);white-space:nowrap;}
  .li-amount.paid{color:var(--safe);}
  .li-actions{display:flex;gap:6px;}
  .icon-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:4px;color:var(--muted);}

  .badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;}
  .badge.unpaid{background:rgba(248,113,113,.15);color:var(--danger);}
  .badge.partial{background:rgba(240,180,41,.15);color:var(--accent2);}
  .badge.paid{background:rgba(74,222,128,.15);color:var(--safe);}

  .tab-btn.quick-pay{flex:0 0 46px;background:var(--accent2);color:#2a1b02;font-size:17px;padding:11px 0;}

  .modal-overlay{position:fixed;inset:0;background:rgba(3,10,6,.72);z-index:1000;
    display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);
    border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:520px;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:slideUp .2s ease-out;}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-title{font-size:16px;font-weight:800;margin-bottom:10px;color:var(--text);}
  .modal-body{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:6px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions .btn{margin-top:0;}
  .modal-error{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:16px;}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 10px;}
  footer{text-align:center;font-size:10.5px;color:var(--muted);margin-top:16px;}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="appTitle">💰 Duka Hesabu</h1>
    <button class="lang-toggle" id="langBtn" onclick="toggleLang()">EN</button>
  </header>

  <div class="tabs">
    <div class="tab-btn active" id="tabBtn-summary" onclick="showTab('summary')" data-i18n="tabSummary">Muhtasari</div>
    <div class="tab-btn" id="tabBtn-sales" onclick="showTab('sales')" data-i18n="tabSales">Mauzo</div>
    <div class="tab-btn" id="tabBtn-debts" onclick="showTab('debts')" data-i18n="tabDebts">Madeni</div>
    <div class="tab-btn quick-pay" onclick="openRecordPaymentModal()" title="Rekodi Malipo">💵</div>
  </div>

  <!-- MODAL -->
  <div id="modalOverlay" class="modal-overlay" style="display:none;">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- SUMMARY TAB -->
  <div id="tab-summary">
    <div class="card">
      <div class="stat-row">
        <div class="stat">
          <div class="label" data-i18n="salesToday">Mauzo ya Leo</div>
          <div class="value" id="statSalesToday">0</div>
        </div>
        <div class="stat">
          <div class="label" data-i18n="debtsOutstanding">Madeni Yaliyobaki</div>
          <div class="value debt" id="statDebtsOutstanding">0</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="stat-row">
        <div class="stat">
          <div class="label" data-i18n="salesWeek">Mauzo Wiki Hii</div>
          <div class="value" id="statSalesWeek">0</div>
        </div>
        <div class="stat">
          <div class="label" data-i18n="salesMonth">Mauzo Mwezi Huu</div>
          <div class="value" id="statSalesMonth">0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="label" data-i18n="weeklyPurchase">Manunuzi ya Wiki</div>
          <div style="font-size:16px;font-weight:800;" id="statWeeklyPurchase">0</div>
        </div>
        <button class="icon-btn" onclick="openWeeklyPurchaseModal()" style="font-size:20px;">✏️</button>
      </div>
    </div>
    <div class="card" style="text-align:center;">
      <div class="label" id="profitLabel" data-i18n="toReachCost">Bado Kufikia Bei ya Bidhaa</div>
      <div style="font-size:24px;font-weight:900;" id="statProfitLoss">0</div>
    </div>
  </div>

  <!-- SALES TAB -->
  <div id="tab-sales" style="display:none;">
    <div class="card">
      <label data-i18n="itemName">Jina la Bidhaa</label>
      <input type="text" id="saleItem" placeholder="Mfano: Sukari kg 1">
      <div class="form-row">
        <div>
          <label data-i18n="price">Bei (kwa kimoja)</label>
          <input type="number" id="salePrice" inputmode="decimal" placeholder="0">
        </div>
        <div>
          <label data-i18n="qty">Idadi</label>
          <input type="number" id="saleQty" inputmode="numeric" value="1">
        </div>
      </div>
      <button class="btn btn-primary" onclick="addSale()" data-i18n="addSale">+ Ongeza Mauzo</button>
    </div>

    <div class="filter-row">
      <div class="filter-btn active" id="salesFilter-today" onclick="setSalesFilter('today')" data-i18n="fToday">Leo</div>
      <div class="filter-btn" id="salesFilter-week" onclick="setSalesFilter('week')" data-i18n="fWeek">Wiki</div>
      <div class="filter-btn" id="salesFilter-month" onclick="setSalesFilter('month')" data-i18n="fMonth">Mwezi</div>
      <div class="filter-btn" id="salesFilter-all" onclick="setSalesFilter('all')" data-i18n="fAll">Zote</div>
    </div>
    <div id="salesList"></div>
  </div>

  <!-- DEBTS TAB -->
  <div id="tab-debts" style="display:none;">
    <div class="card">
      <label data-i18n="customerName">Jina la Mteja</label>
      <input type="text" id="debtCustomer" placeholder="Mfano: Juma Mwalimu">
      <div class="form-row">
        <div>
          <label data-i18n="amount">Kiasi (Deni)</label>
          <input type="number" id="debtAmount" inputmode="decimal" placeholder="0">
        </div>
        <div>
          <label data-i18n="phone">Simu (hiari)</label>
          <input type="text" id="debtPhone" inputmode="tel" placeholder="07XXXXXXXX">
        </div>
      </div>
      <label data-i18n="itemDesc">Bidhaa/Maelezo</label>
      <input type="text" id="debtDesc" placeholder="Mfano: Mchele gunia">
      <button class="btn btn-primary" onclick="addDebt()" data-i18n="addDebt">+ Ongeza Deni</button>
    </div>

    <div class="filter-row">
      <div class="filter-btn active" id="debtsFilter-unpaid" onclick="setDebtsFilter('unpaid')" data-i18n="fUnpaid">Bado</div>
      <div class="filter-btn" id="debtsFilter-paid" onclick="setDebtsFilter('paid')" data-i18n="fPaid">Yamelipwa</div>
      <div class="filter-btn" id="debtsFilter-all2" onclick="setDebtsFilter('all')" data-i18n="fAll">Zote</div>
    </div>
    <div id="debtsList"></div>
  </div>

  <footer data-i18n="footer">Duka Hesabu · Data yako inabaki kwenye simu yako pekee</footer>
</div>

<script>
let lang = 'sw';
let salesFilter = 'today';
let debtsFilter = 'unpaid';

const T = {
  sw: {
    tabSummary:"Muhtasari", tabSales:"Mauzo", tabDebts:"Madeni",
    salesToday:"Mauzo ya Leo", debtsOutstanding:"Madeni Yaliyobaki",
    salesWeek:"Mauzo Wiki Hii", salesMonth:"Mauzo Mwezi Huu",
    weeklyPurchase:"Manunuzi ya Wiki", weeklyPurchaseTitle:"Weka Manunuzi ya Wiki Hii",
    weeklyPurchaseLabel:"Kiasi ulichonunua bidhaa (wiki hii)", save:"Hifadhi",
    toReachCost:"Bado Kufikia Bei ya Bidhaa", profit:"Faida", breakEven:"Sawa na Gharama",
    noPurchaseSet:"Weka manunuzi ya wiki kuanza kulinganisha",
    itemName:"Jina la Bidhaa", price:"Bei (kwa kimoja)", qty:"Idadi", addSale:"+ Ongeza Mauzo",
    customerName:"Jina la Mteja", amount:"Kiasi (Deni)", phone:"Simu (hiari)",
    itemDesc:"Bidhaa/Maelezo", addDebt:"+ Ongeza Deni",
    fToday:"Leo", fWeek:"Wiki", fMonth:"Mwezi", fAll:"Zote", fUnpaid:"Bado", fPaid:"Imelipwa",
    partial:"Sehemu Imelipwa", pay:"Lipa", paidSoFar:"Amelipa", remaining:"Deni Lililobaki",
    enterPayment:"Weka kiasi analolipa sasa",
    noSales:"Hakuna mauzo bado kwa kipindi hiki.", noDebts:"Hakuna madeni kwa kipindi hiki.",
    total:"Jumla", grandTotal:"Jumla Kuu ya Madeni", markPaid:"Amelipa", markUnpaid:"Bado", delete:"Futa",
    confirmDelete:"Una uhakika unataka kufuta hii?",
    confirmDeleteTitle:"Futa Kipengele",
    cancel:"Ghairi",
    recordPayment:"Rekodi Malipo ya Mteja",
    noDebtFound:"Hakuna deni lililopatikana kwa jina hilo.",
    footer:"Duka Hesabu · Data yako inabaki kwenye simu yako pekee",
    fillItem:"Tafadhali jaza jina la bidhaa na bei.",
    fillCustomer:"Tafadhali jaza jina la mteja na kiasi."
  },
  en: {
    tabSummary:"Summary", tabSales:"Sales", tabDebts:"Debts",
    salesToday:"Today's Sales", debtsOutstanding:"Outstanding Debts",
    salesWeek:"This Week's Sales", salesMonth:"This Month's Sales",
    weeklyPurchase:"Weekly Stock Purchase", weeklyPurchaseTitle:"Set This Week's Stock Purchase",
    weeklyPurchaseLabel:"Amount spent on stock (this week)", save:"Save",
    toReachCost:"Still to Reach Cost", profit:"Profit", breakEven:"Break Even",
    noPurchaseSet:"Set weekly purchase to start comparing",
    itemName:"Item Name", price:"Price (per unit)", qty:"Quantity", addSale:"+ Add Sale",
    customerName:"Customer Name", amount:"Amount (Debt)", phone:"Phone (optional)",
    itemDesc:"Item/Description", addDebt:"+ Add Debt",
    fToday:"Today", fWeek:"Week", fMonth:"Month", fAll:"All", fUnpaid:"Unpaid", fPaid:"Paid",
    partial:"Partially Paid", pay:"Pay", paidSoFar:"Paid so far", remaining:"Remaining",
    enterPayment:"Enter the amount they're paying now",
    noSales:"No sales yet for this period.", noDebts:"No debts for this period.",
    total:"Total", grandTotal:"Grand Total Owed", markPaid:"Mark Paid", markUnpaid:"Mark Unpaid", delete:"Delete",
    confirmDelete:"Are you sure you want to delete this?",
    confirmDeleteTitle:"Delete Item",
    cancel:"Cancel",
    recordPayment:"Record Customer Payment",
    noDebtFound:"No debt found under that name.",
    footer:"Duka Hesabu · Your data stays on your phone only",
    fillItem:"Please fill in the item name and price.",
    fillCustomer:"Please fill in the customer name and amount."
  }
};

function applyTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(T[lang][key]) el.textContent = T[lang][key];
  });
  document.getElementById('langBtn').textContent = lang === 'sw' ? 'EN' : 'SW';
  renderSales(); renderDebts(); renderSummary();
}

function toggleLang(){
  lang = lang === 'sw' ? 'en' : 'sw';
  applyTranslations();
}

function showTab(name){
  ['summary','sales','debts'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = (t===name) ? 'block' : 'none';
    document.getElementById('tabBtn-'+t).classList.toggle('active', t===name);
  });
  if(name==='summary') renderSummary();
}

function setSalesFilter(f){
  salesFilter = f;
  ['today','week','month','all'].forEach(k=>{
    document.getElementById('salesFilter-'+k).classList.toggle('active', k===f);
  });
  renderSales();
}
function setDebtsFilter(f){
  debtsFilter = f;
  const map = {unpaid:'unpaid', paid:'paid', all:'all2'};
  ['unpaid','paid','all'].forEach(k=>{
    document.getElementById('debtsFilter-'+map[k]).classList.toggle('active', k===f);
  });
  renderDebts();
}

// ---- Modal ----
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal(){
  document.getElementById('modalOverlay').style.display = 'none';
}

function openRecordPaymentModal(){
  openModal(`
    <div class="modal-title">${T[lang].recordPayment}</div>
    <label>${T[lang].customerName}</label>
    <input type="text" id="rpCustomer" placeholder="${T[lang].customerName}">
    <label>${T[lang].amount}</label>
    <input type="number" id="rpAmount" inputmode="decimal" placeholder="0">
    <div class="modal-error" id="rpError"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="closeModal()">${T[lang].cancel}</button>
      <button class="btn btn-primary" onclick="submitRecordPayment()">${T[lang].pay}</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('rpCustomer').focus(), 50);
}

function submitRecordPayment(){
  const customer = document.getElementById('rpCustomer').value.trim();
  let amt = parseFloat(document.getElementById('rpAmount').value);
  const errEl = document.getElementById('rpError');

  if(!customer || isNaN(amt) || amt<=0){
    errEl.textContent = T[lang].fillCustomer;
    return;
  }

  const debts = loadDebts();
  const key = customer.toLowerCase();
  const custDebts = debts.filter(d=>d.customer.trim().toLowerCase()===key && getRemaining(d)>0)
                          .sort((a,b)=>a.ts-b.ts);

  if(custDebts.length===0){
    errEl.textContent = T[lang].noDebtFound;
    return;
  }

  for(const d of custDebts){
    if(amt<=0) break;
    const remaining = getRemaining(d);
    const pay = Math.min(remaining, amt);
    if(!d.payments) d.payments = [];
    d.payments.push({ amt: pay, ts: Date.now() });
    if(getRemaining(d) <= 0) d.paid = true;
    amt -= pay;
  }
  saveDebts(debts);
  closeModal();
  showTab('debts');
  setDebtsFilter('all');
}

function confirmDeleteModal(kind, id){
  openModal(`
    <div class="modal-title">${T[lang].confirmDeleteTitle}</div>
    <div class="modal-body">${T[lang].confirmDelete}</div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="closeModal()">${T[lang].cancel}</button>
      <button class="btn btn-primary" onclick="${kind==='sale' ? 'doDeleteSale' : 'doDeleteDebt'}(${id})">${T[lang].delete}</button>
    </div>
  `);
}
function doDeleteSale(id){
  saveSales(loadSales().filter(s=>s.id!==id));
  closeModal();
  renderSales(); renderSummary();
}
function doDeleteDebt(id){
  saveDebts(loadDebts().filter(d=>d.id!==id));
  closeModal();
  renderDebts(); renderSummary();
}
function getWeekStartStr(d){
  const dt = new Date(d || new Date());
  const day = dt.getDay(); // 0=Sun..6=Sat
  const diff = (day===0 ? -6 : 1) - day; // shift to Monday
  dt.setDate(dt.getDate()+diff);
  dt.setHours(0,0,0,0);
  return todayStr(dt);
}
function getCalendarWeekSalesTotal(){
  const weekStartStr = getWeekStartStr();
  const weekStart = new Date(weekStartStr+'T00:00:00');
  const weekEnd = new Date(weekStart.getTime() + 7*24*60*60*1000);
  return loadSales().filter(s=>{
    const d = new Date(s.ts);
    return d >= weekStart && d < weekEnd;
  }).reduce((s,x)=>s+x.total,0);
}
function loadWeeklyPurchase(){ try{ return JSON.parse(localStorage.getItem('duka_weekly_purchase')||'null'); }catch(e){ return null; } }
function saveWeeklyPurchase(obj){ localStorage.setItem('duka_weekly_purchase', JSON.stringify(obj)); }
function getCurrentWeekPurchaseAmount(){
  const wp = loadWeeklyPurchase();
  const ws = getWeekStartStr();
  return (wp && wp.weekStart===ws) ? wp.amount : 0;
}

function openWeeklyPurchaseModal(){
  const current = getCurrentWeekPurchaseAmount();
  openModal(`
    <div class="modal-title">${T[lang].weeklyPurchaseTitle}</div>
    <label>${T[lang].weeklyPurchaseLabel}</label>
    <input type="number" id="wpAmount" inputmode="decimal" value="${current||''}" placeholder="0">
    <div class="modal-error" id="wpError"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="closeModal()">${T[lang].cancel}</button>
      <button class="btn btn-primary" onclick="submitWeeklyPurchase()">${T[lang].save}</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('wpAmount').focus(), 50);
}
function submitWeeklyPurchase(){
  const amt = parseFloat(document.getElementById('wpAmount').value);
  const errEl = document.getElementById('wpError');
  if(isNaN(amt) || amt<0){ errEl.textContent = T[lang].fillCustomer; return; }
  saveWeeklyPurchase({ weekStart: getWeekStartStr(), amount: amt });
  closeModal();
  renderSummary();
}

function loadSales(){ try{ return JSON.parse(localStorage.getItem('duka_sales')||'[]'); }catch(e){ return []; } }
function saveSales(arr){ localStorage.setItem('duka_sales', JSON.stringify(arr)); }
function loadDebts(){ try{ return JSON.parse(localStorage.getItem('duka_debts')||'[]'); }catch(e){ return []; } }
function saveDebts(arr){ localStorage.setItem('duka_debts', JSON.stringify(arr)); }

function todayStr(d){
  const dt = d || new Date();
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function fmt(n){ return Number(n).toLocaleString(undefined,{maximumFractionDigits:0}); }

// ---- Sales ----
function addSale(){
  const item = document.getElementById('saleItem').value.trim();
  const price = parseFloat(document.getElementById('salePrice').value);
  const qty = parseFloat(document.getElementById('saleQty').value) || 1;
  if(!item || isNaN(price)){ alert(T[lang].fillItem); return; }

  const sales = loadSales();
  sales.push({ id: Date.now(), item, price, qty, total: price*qty, ts: Date.now() });
  saveSales(sales);

  document.getElementById('saleItem').value='';
  document.getElementById('salePrice').value='';
  document.getElementById('saleQty').value='1';
  renderSales(); renderSummary();
}

function deleteSale(id){
  confirmDeleteModal('sale', id);
}

function filterByPeriod(items, period){
  const now = new Date();
  return items.filter(it=>{
    const d = new Date(it.ts);
    if(period==='today') return todayStr(d)===todayStr(now);
    if(period==='week'){
      const diffDays = (now - d) / (1000*60*60*24);
      return diffDays >= 0 && diffDays <= 7;
    }
    if(period==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    return true;
  });
}

function renderSales(){
  const list = document.getElementById('salesList');
  if(!list) return;
  const all = loadSales().sort((a,b)=>b.ts-a.ts);
  const filtered = filterByPeriod(all, salesFilter);

  if(filtered.length===0){
    list.innerHTML = `<div class="empty">${T[lang].noSales}</div>`;
    return;
  }
  let total = 0;
  let html = '';
  filtered.forEach(s=>{
    total += s.total;
    const d = new Date(s.ts);
    html += `
      <div class="list-item">
        <div class="li-main">
          <div class="li-title">${s.item}</div>
          <div class="li-sub">${s.qty} × ${fmt(s.price)} · ${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <div class="li-amount">${fmt(s.total)}</div>
        <div class="li-actions"><button class="icon-btn" onclick="deleteSale(${s.id})" title="${T[lang].delete}">🗑️</button></div>
      </div>`;
  });
  html += `<div class="card" style="text-align:center;font-weight:800;">${T[lang].total}: ${fmt(total)}</div>`;
  list.innerHTML = html;
}

// ---- Debts ----
function addDebt(){
  const customer = document.getElementById('debtCustomer').value.trim();
  const amount = parseFloat(document.getElementById('debtAmount').value);
  const phone = document.getElementById('debtPhone').value.trim();
  const desc = document.getElementById('debtDesc').value.trim();
  if(!customer || isNaN(amount)){ alert(T[lang].fillCustomer); return; }

  const debts = loadDebts();
  debts.push({ id: Date.now(), customer, amount, phone, desc, paid:false, ts: Date.now() });
  saveDebts(debts);

  document.getElementById('debtCustomer').value='';
  document.getElementById('debtAmount').value='';
  document.getElementById('debtPhone').value='';
  document.getElementById('debtDesc').value='';
  renderDebts(); renderSummary();
}

function groupByCustomer(list){
  const groups = {};
  const order = [];
  list.forEach(d=>{
    const key = d.customer.trim().toLowerCase();
    if(!groups[key]){
      groups[key] = { name: d.customer.trim(), phone: d.phone, items: [] };
      order.push(key);
    }
    groups[key].items.push(d);
    if(!groups[key].phone && d.phone) groups[key].phone = d.phone;
  });
  return order.map(k=>groups[k]);
}

function getRemaining(d){
  if(d.payments && d.payments.length){
    const paidSum = d.payments.reduce((s,p)=>s+p.amt,0);
    return Math.max(0, d.amount - paidSum);
  }
  return d.paid ? 0 : d.amount;
}
function getPaidSum(d){
  if(d.payments && d.payments.length) return d.payments.reduce((s,p)=>s+p.amt,0);
  return d.paid ? d.amount : 0;
}

function payDebt(id){
  const debts = loadDebts();
  const d = debts.find(x=>x.id===id);
  if(!d) return;
  const remaining = getRemaining(d);
  openModal(`
    <div class="modal-title">💰 ${T[lang].pay} — ${d.customer}</div>
    <div class="modal-body">${T[lang].remaining}: <b>${fmt(remaining)}</b></div>
    <label>${T[lang].amount}</label>
    <input type="number" id="payAmount" inputmode="decimal" placeholder="0">
    <div class="modal-error" id="payError"></div>
    <div class="modal-actions">
      <button class="btn btn-danger" onclick="closeModal()">${T[lang].cancel}</button>
      <button class="btn btn-primary" onclick="submitPayDebt(${id})">${T[lang].pay}</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('payAmount').focus(), 50);
}

function submitPayDebt(id){
  const amt = parseFloat(document.getElementById('payAmount').value);
  const errEl = document.getElementById('payError');
  if(isNaN(amt) || amt<=0){ errEl.textContent = T[lang].fillCustomer; return; }

  const debts = loadDebts();
  const d = debts.find(x=>x.id===id);
  if(!d) { closeModal(); return; }
  const remaining = getRemaining(d);
  if(!d.payments) d.payments = [];
  d.payments.push({ amt: Math.min(amt, remaining), ts: Date.now() });
  if(getRemaining(d) <= 0) d.paid = true;
  saveDebts(debts);
  closeModal();
  renderDebts(); renderSummary();
}

function deleteDebt(id){
  confirmDeleteModal('debt', id);
}

function renderDebts(){
  const list = document.getElementById('debtsList');
  if(!list) return;
  const all = loadDebts().sort((a,b)=>b.ts-a.ts);

  const grandTotal = all.reduce((s,d)=> s + getRemaining(d), 0);

  let filtered = all;
  if(debtsFilter==='unpaid') filtered = all.filter(d=>getRemaining(d) > 0);
  if(debtsFilter==='paid') filtered = all.filter(d=>getRemaining(d) <= 0);

  if(filtered.length===0){
    list.innerHTML = `<div class="empty">${T[lang].noDebts}</div>`;
    return;
  }

  const groups = groupByCustomer(filtered);
  let html = '';

  groups.forEach(g=>{
    let groupRemaining = 0;
    let itemsHtml = '';
    g.items.forEach(d=>{
      const remaining = getRemaining(d);
      const paidSum = getPaidSum(d);
      groupRemaining += remaining;
      const dt = new Date(d.ts);
      const status = remaining <= 0 ? T[lang].fPaid : (paidSum > 0 ? T[lang].partial : T[lang].fUnpaid);
      const badgeClass = remaining <= 0 ? 'paid' : (paidSum > 0 ? 'partial' : 'unpaid');
      const subNote = paidSum > 0
        ? `${T[lang].paidSoFar}: ${fmt(paidSum)} · ${T[lang].remaining}: ${fmt(remaining)}`
        : `${T[lang].amount}: ${fmt(d.amount)}`;

      itemsHtml += `
        <div class="list-item">
          <div class="li-main">
            <div class="li-title">${d.desc || (lang==='sw'?'Deni':'Debt')}</div>
            <div class="li-sub">${dt.toLocaleDateString()} · ${subNote}
              <span class="badge ${badgeClass}">${status}</span>
            </div>
          </div>
          <div class="li-amount ${remaining<=0?'paid':''}">${fmt(remaining)}</div>
          <div class="li-actions">
            ${remaining > 0 ? `<button class="icon-btn" onclick="payDebt(${d.id})" title="${T[lang].pay}">💰</button>` : ''}
            <button class="icon-btn" onclick="deleteDebt(${d.id})" title="${T[lang].delete}">🗑️</button>
          </div>
        </div>`;
    });

    html += `
      <div class="card" style="padding-bottom:6px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div style="font-weight:800;font-size:15px;">👤 ${g.name}${g.phone ? ' · '+g.phone : ''}</div>
          <div style="font-weight:800;color:var(--accent2);">${T[lang].total}: ${fmt(groupRemaining)}</div>
        </div>
        ${itemsHtml}
      </div>`;
  });

  html += `<div class="card" style="text-align:center;font-weight:800;">${T[lang].grandTotal}: ${fmt(grandTotal)}</div>`;
  list.innerHTML = html;
}

// ---- Summary ----
function renderSummary(){
  const sales = loadSales();
  const debts = loadDebts();

  const today = filterByPeriod(sales,'today').reduce((s,x)=>s+x.total,0);
  const week = filterByPeriod(sales,'week').reduce((s,x)=>s+x.total,0);
  const month = filterByPeriod(sales,'month').reduce((s,x)=>s+x.total,0);
  const outstanding = debts.reduce((s,x)=>s+getRemaining(x),0);

  document.getElementById('statSalesToday').textContent = fmt(today);
  document.getElementById('statSalesWeek').textContent = fmt(week);
  document.getElementById('statSalesMonth').textContent = fmt(month);
  document.getElementById('statDebtsOutstanding').textContent = fmt(outstanding);

  const purchase = getCurrentWeekPurchaseAmount();
  const calWeekSales = getCalendarWeekSalesTotal();
  const diff = calWeekSales - purchase;

  document.getElementById('statWeeklyPurchase').textContent = fmt(purchase);
  const plEl = document.getElementById('statProfitLoss');
  const labelEl = document.getElementById('profitLabel');

  if(purchase === 0){
    plEl.textContent = '—';
    plEl.style.color = 'var(--muted)';
    labelEl.textContent = T[lang].noPurchaseSet;
  } else if(diff < 0){
    plEl.textContent = '-' + fmt(Math.abs(diff));
    plEl.style.color = 'var(--danger)';
    labelEl.textContent = T[lang].toReachCost;
  } else if(diff > 0){
    plEl.textContent = '+' + fmt(diff);
    plEl.style.color = 'var(--safe)';
    labelEl.textContent = T[lang].profit;
  } else {
    plEl.textContent = '0';
    plEl.style.color = 'var(--accent2)';
    labelEl.textContent = T[lang].breakEven;
  }
}

applyTranslations();
showTab('summary');
</script>
